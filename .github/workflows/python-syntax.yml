name: Cross-platform Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run portable runtime tests
        run: python -m unittest discover -s tests -p "test_platform.py"
