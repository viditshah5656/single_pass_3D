<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System · AeroSynth</title><link rel="stylesheet" href="/frontend/app.css"></head><body data-page="system"><div class="app-shell"><div id="shell"></div><main class="page"><header class="page-title"><div><span class="eyebrow">Runtime</span><h1 class="gradient-text">System readiness</h1><p>Clear backend diagnostics without mixing infrastructure details into the reconstruction workflow.</p></div><a class="btn btn-secondary" href="/docs" target="_blank">Open API docs</a></header><section class="grid grid-4" id="systemMetrics"><article class="card glass empty" style="grid-column:1/-1">Running preflight…</article></section><div class="section-head"><div><span class="eyebrow">Native backends</span><h2>Reconstruction toolchain</h2></div></div><section class="grid grid-2"><article class="card glass"><h3>OpenMVS</h3><div class="stage-list" id="mvsList"></div></article><article class="card glass"><h3>Python packages</h3><div class="stage-list" id="packageList"></div></article></section></main></div><div class="modal-backdrop" id="newProjectModal"><div class="modal glass"><div class="modal-head"><h2>System is ready for work</h2><button class="btn btn-secondary icon-btn" data-modal-close>×</button></div><a class="btn btn-primary" href="/reconstruct">Create reconstruction</a></div></div><script src="/frontend/app.js"></script><script>document.getElementById('shell').innerHTML=Aero.shell();Promise.all([Aero.api('/preflight'),Aero.api('/system-info')]).then(([p,s])=>{systemMetrics.innerHTML=`<article class="card glass metric"><span class="metric-label">Readiness</span><strong class="metric-value ${p.status==='ready'?'good':'bad'}">${p.status}</strong><span class="metric-foot">Full pipeline preflight</span></article><article class="card glass metric"><span class="metric-label">Compute backend</span><strong class="metric-value">${p.device}</strong><span class="metric-foot">${s.device_name}</span></article><article class="card glass metric"><span class="metric-label">Python</span><strong class="metric-value">${s.python}</strong><span class="metric-foot">${s.platform.split('-')[0]}</span></article><article class="card glass metric"><span class="metric-label">Pipeline</span><strong class="metric-value">${s.pipeline_version}</strong><span class="metric-foot">AeroSynth runtime</span></article>`;mvsList.innerHTML=Object.entries(p.openmvs).map(([n,v])=>`<div class="stage ${v?'done':''}"><span class="stage-num">${v?'✓':'!'}</span><span>${n}</span><strong style="margin-left:auto">${v?'Ready':'Missing'}</strong></div>`).join('');packageList.innerHTML=Object.entries(p.python_packages).map(([n,v])=>`<div class="stage ${v?'done':''}"><span class="stage-num">${v?'✓':'!'}</span><span>${n}</span><strong style="margin-left:auto">${v?'Installed':'Missing'}</strong></div>`).join('')}).catch(e=>{systemMetrics.innerHTML=`<article class="card glass empty bad" style="grid-column:1/-1">${e.message}</article>`});</script></body></html>
